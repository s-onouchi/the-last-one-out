<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- No pinch / double-tap zoom: touches are game input. viewport-fit=cover fills notched screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Last One Out</title>
    <style>
      /* Pin the page to the visible viewport so mobile address-bar resizing,
         rubber-band overscroll and pull-to-refresh can't scroll it. */
      html, body {
        position: fixed;
        inset: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        background: #000;
      }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
